services:
  - type: web
    name: khatha-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npx pm2-runtime start ecosystem.config.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - fromGroup: khatha-secrets
